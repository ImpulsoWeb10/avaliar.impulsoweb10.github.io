<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luciano Cabeleireiro | VIP Experience</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Quicksand', sans-serif;
            background: radial-gradient(circle at center, #1a1a1a 0%, #0a0a0a 100%);
            color: white;
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; padding: 15px;
        }

        .container {
            max-width: 420px; width: 100%;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            padding: 40px 25px; border-radius: 40px;
            border: 1px solid rgba(250, 204, 21, 0.15);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
            text-align: center; position: relative;
        }

        .social-proof {
            position: absolute; top: -15px; left: 50%; transform: translateX(-50%);
            background: #facc15; color: #000; padding: 8px 20px;
            border-radius: 25px; font-size: 10px; font-weight: 900;
            white-space: nowrap; box-shadow: 0 10px 20px rgba(250, 204, 21, 0.2);
            z-index: 10; letter-spacing: 1px;
        }

        .logo { 
            width: 100%; max-width: 280px; height: auto;
            border-radius: 15px; margin-bottom: 20px;
            border: 1px solid rgba(250, 204, 21, 0.3);
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }

        h1 { font-size: 24px; color: #fff; margin-bottom: 5px; font-weight: 700; }
        h2 { font-size: 12px; color: #facc15; margin-bottom: 30px; text-transform: uppercase; letter-spacing: 2px; }
        
        #emoji-reacao { font-size: 50px; margin-bottom: 10px; display: block; height: 60px; }

        .rating-box { margin-bottom: 35px; display: flex; justify-content: center; gap: 12px; }
        .star-btn {
            font-size: 38px; color: #334155; cursor: pointer;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .star-btn.active { color: #facc15; transform: scale(1.15); text-shadow: 0 0 20px rgba(250, 204, 21, 0.5); }

        .botao {
            display: flex; align-items: center; justify-content: center; gap: 12px;
            width: 100%; padding: 18px; border-radius: 15px;
            font-weight: 800; font-size: 14px; text-decoration: none; transition: 0.3s;
            border: none; cursor: pointer; margin-bottom: 15px;
        }

        /* BOTÃO GOOGLE COM EFEITO PULSANTE E BRILHO */
        .google {
            background: #facc15;
            color: #000;
            position: relative;
            overflow: hidden;
            animation: pulse-google 2s infinite;
        }

        @keyframes pulse-google {
            0%   { box-shadow: 0 0 0 0 rgba(250, 204, 21, 0.7), 0 4px 15px rgba(250,204,21,0.3); }
            50%  { box-shadow: 0 0 0 12px rgba(250, 204, 21, 0), 0 4px 25px rgba(250,204,21,0.6); }
            100% { box-shadow: 0 0 0 0 rgba(250, 204, 21, 0), 0 4px 15px rgba(250,204,21,0.3); }
        }

        .google::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 60%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
            animation: shine 2.5s infinite;
        }

        @keyframes shine {
            0%   { left: -100%; }
            40%  { left: 130%; }
            100% { left: 130%; }
        }

        .google:hover { transform: translateY(-3px); }

        .btn-modal { background: #fff; color: #000; box-shadow: 0 4px 15px rgba(255,255,255,0.1); }

        /* ÍCONES SOCIAIS REDONDOS COM LABEL */
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 5px;
            margin-bottom: 25px;
        }

        .social-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 7px;
        }

        .social-icon {
            width: 48px; height: 48px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 19px;
            text-decoration: none;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .social-icon:hover { transform: scale(1.15) translateY(-3px); }

        .social-label {
            font-size: 9px;
            font-weight: 700;
            color: rgba(255,255,255,0.5);
            letter-spacing: 0.4px;
            text-transform: uppercase;
            text-align: center;
        }

        .icon-whatsapp { background: #25D366; color: #fff; box-shadow: 0 6px 18px rgba(37,211,102,0.35); }
        .icon-facebook { background: #1877F2; color: #fff; box-shadow: 0 6px 18px rgba(24,119,242,0.35); }
        .icon-maps     { background: #EA4335; color: #fff; box-shadow: 0 6px 18px rgba(234,67,53,0.35); }
        .icon-photos   { background: linear-gradient(135deg, #4285F4 0%, #34A853 40%, #FBBC05 70%, #EA4335 100%); color: #fff; box-shadow: 0 6px 18px rgba(66,133,244,0.35); }

        /* MODAL */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); backdrop-filter: blur(10px);
            display: none; align-items: center; justify-content: center; z-index: 100;
            padding: 20px;
        }

        .modal-content {
            background: #1a1a1a; width: 100%; max-width: 360px;
            padding: 30px; border-radius: 30px; border: 1px solid #333;
            text-align: left; animation: slideUp 0.4s ease;
        }

        .modal-content h3 { font-size: 20px; margin-bottom: 20px; color: #facc15; text-align: center; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; color: #888; margin-bottom: 8px; margin-left: 5px; }
        
        .input-style {
            width: 100%; background: #222; border: 1px solid #444;
            padding: 15px; border-radius: 12px; color: white;
            font-family: inherit; font-size: 15px; outline: none;
        }

        .btn-confirmar { background: #22c55e; color: white; margin-top: 10px; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }

        .footer { margin-top: 30px; font-size: 10px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 20px; color: rgba(255,255,255,0.4); }
    </style>
</head>
<body>

<div class="container">
    <div class="social-proof"><i class="fas fa-certificate"></i> TOP 1 DA REGIÃO</div>

    <img src="luciano-cabeleireiro.png" class="logo" alt="Luciano Cabeleireiro">

    <h1>Luciano Cabeleireiro</h1>
    <h2>Corte, Estilo e Autoestima</h2>
    
    <div id="emoji-reacao">✨</div>

    <div class="rating-box">
        <i class="fas fa-star star-btn" onclick="avaliar(1)"></i>
        <i class="fas fa-star star-btn" onclick="avaliar(2)"></i>
        <i class="fas fa-star star-btn" onclick="avaliar(3)"></i>
        <i class="fas fa-star star-btn" onclick="avaliar(4)"></i>
        <i class="fas fa-star star-btn" onclick="avaliar(5)"></i>
    </div>

    <div id="acoes-cliente">
        <a href="https://g.page/r/CQiTydJeNCpGEAE/review" class="botao google" target="_blank" rel="noopener">
            <i class="fab fa-google"></i> AVALIAR NO GOOGLE
        </a>

        <button onclick="abrirModal()" class="botao btn-modal">
            <i class="far fa-calendar-alt"></i> AGENDAR PRÓXIMO VISUAL
        </button>
    </div>

    <!-- ÍCONES SOCIAIS REDONDOS COM LEGENDA -->
    <div class="social-icons">

        <div class="social-item">
            <a href="https://wa.me/5511970967674" target="_blank" rel="noopener" class="social-icon icon-whatsapp" title="WhatsApp">
                <i class="fab fa-whatsapp"></i>
            </a>
            <span class="social-label">WhatsApp</span>
        </div>

        <div class="social-item">
            <a href="https://www.facebook.com/share/14dfyA4QS5j/" target="_blank" rel="noopener" class="social-icon icon-facebook" title="Facebook">
                <i class="fab fa-facebook-f"></i>
            </a>
            <span class="social-label">Facebook</span>
        </div>

        <div class="social-item">
            <a href="https://maps.google.com/?q=Av.+Turmalina,+863+-+Est%C3%A2ncia+Fraternidade,+Itaquaquecetuba+-+SP,+08589-000,+Brasil" target="_blank" rel="noopener" class="social-icon icon-maps" title="Como Chegar">
                <i class="fas fa-map-marker-alt"></i>
            </a>
            <span class="social-label">Como Chegar</span>
        </div>

        <div class="social-item">
            <a href="https://photos.google.com/share/AF1QipOraS9PLMLf7lpTthkcJuJqrqF1qFQiytczktSlS5iJ1X4K5ACJfggqdyyKqEqLIQ?key=SUJrdzhmWFVrdzVsdzhnSkRoalRsUVQydTNoZmdn" target="_blank" rel="noopener" class="social-icon icon-photos" title="Ver Cortes">
                <i class="fas fa-images"></i>
            </a>
            <span class="social-label">Cortes</span>
        </div>

    </div>

    <div class="footer">
        <div>🔒 AMBIENTE SEGURO | © 2026</div>
        <div style="margin-top: 8px;">Desenvolvido por <a href="https://impulsoweb10.com.br/" style="color:#facc15; text-decoration:none; font-weight:700;">ImpulsoWeb10</a></div>
    </div>
</div>

<div class="modal-overlay" id="modalAgendamento">
    <div class="modal-content">
        <h3>Agendar Horário</h3>
        
        <div class="form-group">
            <label>Seu Nome</label>
            <input type="text" id="nomeCliente" class="input-style" placeholder="Como podemos te chamar?">
        </div>

        <div class="form-group">
            <label>Data</label>
            <input type="date" id="dataAgendamento" class="input-style">
        </div>

        <div class="form-group">
            <label>Horário</label>
            <input type="time" id="horaAgendamento" class="input-style">
        </div>

        <button onclick="enviarAgendamento()" class="botao btn-confirmar">
            <i class="fab fa-whatsapp"></i> ENVIAR SOLICITAÇÃO
        </button>
        
        <button onclick="fecharModal()" style="background:transparent; color:#888; border:none; width:100%; font-size:12px; cursor:pointer; margin-top:10px;">Voltar</button>
    </div>
</div>

<script>
    const emojis = ["✨", "☹️", "😐", "🙂", "🤩", "😍"];
    const telefoneBarbearia = "5511970967674";

    function avaliar(n) {
        const stars = document.querySelectorAll('.star-btn');
        const emojiArea = document.getElementById('emoji-reacao');

        stars.forEach((s, i) => {
            if (i < n) s.classList.add('active');
            else s.classList.remove('active');
        });

        emojiArea.innerText = emojis[n];

        if (n >= 4) {
            confetti({ 
                particleCount: 120, spread: 60, origin: { y: 0.8 },
                colors: ['#facc15', '#ffffff'] 
            });
        }
    }

    function abrirModal() {
        document.getElementById('modalAgendamento').style.display = 'flex';
    }

    function fecharModal() {
        document.getElementById('modalAgendamento').style.display = 'none';
    }

    function enviarAgendamento() {
        const nome = document.getElementById('nomeCliente').value;
        const data = document.getElementById('dataAgendamento').value;
        const hora = document.getElementById('horaAgendamento').value;

        if(!nome || !data || !hora) {
            alert("Por favor, preencha nome, data e hora.");
            return;
        }

        const dataFormatada = data.split('-').reverse().join('/');

        const mensagem = encodeURIComponent(
            `*Novo Agendamento (Site)*\n\n` +
            `👤 *Cliente:* ${nome}\n` +
            `📅 *Data:* ${dataFormatada}\n` +
            `⏰ *Hora:* ${hora}\n\n` +
            `_Gostaria de confirmar este horário!_`
        );

        window.open(`https://wa.me/${telefoneBarbearia}?text=${mensagem}`, '_blank');
        fecharModal();
    }

    window.onclick = function(event) {
        const modal = document.getElementById('modalAgendamento');
        if (event.target == modal) fecharModal();
    }
</script>

</body>
</html>
