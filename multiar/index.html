<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliação - MultiAr</title>
    <!-- Font Awesome para os ícones das redes sociais -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Reset e Estilo Geral (Inspirado no Sonat Music) */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0d0d0d; /* Fundo escuro premium */
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px 15px;
        }

        .container {
            max-width: 450px;
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 30px;
        }

        /* Topo: Setas e Logo MultiAr */
        .header-empresa {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .setas {
            font-size: 28px;
            color: #00a8ff; /* Azul neon sutil para combinar com Ar Condicionado */
            margin-bottom: 10px;
            animation: bounce 1.3s infinite;
        }

        .logo-empresa {
            max-width: 140px;
            height: auto;
            object-fit: contain;
            /* Sombra neon suave atrás da logo */
            filter: drop-shadow(0px 4px 10px rgba(0, 168, 255, 0.3)); 
        }

        .nome-empresa {
            font-size: 26px;
            font-weight: 700;
            color: #ffffff;
            margin-top: 15px;
            letter-spacing: 1px;
        }

        /* Texto Pulsante: Dê sua avaliação */
        .txt-avaliacao {
            font-size: 22px;
            font-weight: 800;
            color: #ff3838; /* Vermelho vibrante que se destaca no escuro */
            margin: 25px 0;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            animation: pulsar-texto 1.2s infinite alternate;
        }

        /* Botão do Google */
        .btn-google {
            background-color: #ffffff;
            border: none;
            border-radius: 50px;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-decoration: none;
            color: #333333;
            font-weight: 700;
            font-size: 16px;
            box-shadow: 0 4px 15px rgba(255,255,255,0.1);
            width: 90%;
            margin-bottom: 15px;
            transition: transform 0.2s;
        }

        .btn-google img {
            width: 24px;
            height: 24px;
        }

        /* Botão Amarelo Pulsante (Embaixo do Google) */
        .btn-amarelo {
            background-color: #ffd32a; /* Amarelo vivo estilo a referência */
            color: #000000;
            border: none;
            border-radius: 50px;
            padding: 16px 30px;
            font-size: 16px;
            font-weight: 800;
            text-decoration: none;
            width: 90%;
            text-transform: uppercase;
            box-shadow: 0 4px 20px rgba(255, 211, 42, 0.4);
            animation: pulsar-botao 2s infinite;
            display: inline-block;
            margin-bottom: 40px;
        }

        /* Botões de Redes Sociais iguaizinhos aos da página indicada */
        .redes-sociais {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: auto; /* Empurra para a parte inferior */
            padding-bottom: 40px;
        }

        .social-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: #1a1a1a; /* Fundo escuro pros botões das redes */
            border: 1px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 22px;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .social-icon:hover {
            transform: translateY(-5px);
            background-color: #ffffff;
            color: #0d0d0d;
        }

        /* Rodapé padrão igual ImpulsoWeb 10 */
        .rodape {
            width: 100%;
            font-size: 11px;
            color: #666666;
            padding: 20px 0 10px 0;
            border-top: 1px solid #1a1a1a;
            background-color: #0d0d0d;
            letter-spacing: 0.5px;
        }

        .rodape a {
            color: #ffd32a; /* Link amarelo combinando com o padrão de rodapé */
            text-decoration: none;
            font-weight: bold;
        }

        /* --- ANIMAÇÕES --- */
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        @keyframes pulsar-texto {
            0% { transform: scale(1); opacity: 0.9; text-shadow: 0 0 5px rgba(255,56,56,0.3); }
            100% { transform: scale(1.06); opacity: 1; text-shadow: 0 0 15px rgba(255,56,56,0.7); }
        }

        @keyframes pulsar-botao {
            0% { transform: scale(1); box-shadow: 0 4px 15px rgba(255, 211, 42, 0.4); }
            50% { transform: scale(1.03); box-shadow: 0 4px 25px rgba(255, 211, 42, 0.8); }
            100% { transform: scale(1); box-shadow: 0 4px 15px rgba(255, 211, 42, 0.4); }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Topo da página com setas apontando para a logo -->
        <div class="header-empresa">
            <div class="setas">▼ ▼</div>
            <!-- Substitua pela imagem real da logo da MultiAr -->
            <img src="https://via.placeholder.com/150x150/1a1a1a/ffffff?text=MultiAr" alt="Logo MultiAr" class="logo-empresa">
            <div class="nome-empresa">MultiAr</div>
        </div>

        <!-- Texto Pulsante -->
        <div class="txt-avaliacao">Dê sua avaliação</div>

        <!-- Botão do Google Centralizado -->
        <!-- Insira o link da sua avaliação no lugar do '#' -->
        <a href="#" class="btn-google" target="_blank">
            <img src="https://fonts.gstatic.com/s/i/productlogos/googleg/v6/web-24dp/logo_googleg_color_24dp.png" alt="Google">
            Avaliar no Google
        </a>

        <!-- Botão Amarelo Pulsante Logo Embaixo -->
        <a href="#" class="btn-amarelo">Clique aqui para Avaliar</a>

        <!-- Botões de redes sociais iguais aos da parte de baixo da referência -->
        <div class="redes-sociais">
            <a href="#" class="social-icon" target="_blank"><i class="fab fa-whatsapp"></i></a>
            <a href="#" class="social-icon" target="_blank"><i class="fab fa-instagram"></i></a>
            <a href="#" class="social-icon" target="_blank"><i class="fab fa-facebook-f"></i></a>
            <a href="#" class="social-icon" target="_blank"><i class="fas fa-globe"></i></a>
        </div>

    </div>

    <!-- Rodapé clássico sobre a impulsoweb 10 -->
    <footer class="rodape">
        Desenvolvido por <a href="https://impulsoweb10.com.br" target="_blank">ImpulsoWeb 10</a>
    </footer>

</body>
</html>
