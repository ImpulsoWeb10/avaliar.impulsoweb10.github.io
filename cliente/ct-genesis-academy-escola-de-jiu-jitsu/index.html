function hexRgb(h){h=h.replace('#','');return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)]}
function misturar(a,b,t){var x=hexRgb(a),y=hexRgb(b);return 'rgb('+x.map(function(v,i){return Math.round(y[i]+(v-y[i])*t)}).join(',')+')'}
function rgbDe(c){return c.replace(/[^\d,]/g,'')}
function aplicarTema(id){
  const p=PALETAS.find(function(x){return x.id===id})||PALETAS[0], s=document.documentElement.style;
  s.setProperty('--ac',p.ac);s.setProperty('--ac-l',p.l);s.setProperty('--ac-m',p.m);s.setProperty('--ac-xl',p.xl);
  s.setProperty('--ac-d',p.d);s.setProperty('--ac-bg',p.bg);s.setProperty('--ac-rgb',p.rgb);

  var fr,in1,in2,o1,o2,o3;

  s.setProperty('--in1',in1);s.setProperty('--in2',in2);
  s.setProperty('--out1',o1);s.setProperty('--out2',o2);s.setProperty('--out3',o3);
  s.setProperty('--out-rgb',rgbDe(o2.charAt(0)==='#'?'rgb('+hexRgb(o2).join(',')+')':o2));
  var mt=document.querySelector('meta[name="theme-color"]');if(mt)mt.setAttribute('content',o2);
  return p.id;
}

.btn-nav-map{background:#1c1c22;color:#ffffff;border:1.5px solid rgba(66,133,244,.6)}
.btn-nav-waze{background:#1c1c22;color:#ffffff;border:1.5px solid rgba(51,204,255,.6)}
.faq-container{display:flex;flex-direction:column;gap:.45rem}
.faq-item{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:10px;overflow:hidden;transition:background .2s, border-color .2s}
.faq-item[open]{background:rgba(255,255,255,.08);border-color:rgba(var(--ac-rgb),.4)}
.faq-question{font-size:.82rem;font-weight:700;color:#ffffff;padding:.65rem .8rem;cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;user-select:none}
.faq-question::-webkit-details-marker{display:none}
.faq-question::after{content:'+';font-size:1.1rem;color:var(--ac);font-weight:700;transition:transform .2s}
.faq-item[open] .faq-question::after{content:'−'}
.faq-answer{font-size:.78rem;line-height:1.5;color:#d4d4da;padding:0 .8rem .8rem .8rem;border-top:1px solid rgba(255,255,255,.06);margin-top:.1rem;padding-top:.45rem}
.btn-share{display:flex;align-items:center;justify-content:center;gap:.5rem;width:100%;min-height:46px;background:rgba(255,255,255,.08);color:#fff;border:1.5px solid rgba(255,255,255,.35);border-radius:50px;font-family:inherit;font-weight:700;font-size:.86rem;cursor:pointer}
.btn-share:hover{background:rgba(255,255,255,.16)}
.btn-share svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.toast{min-height:1.1em;text-align:center;font-size:.78rem;color:#4ade80}
.bg-seo{display:none}

.logo-frame{cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.lb{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;max-width:none;max-height:none;margin:0;border:none;background:transparent;color:#fff;overflow:hidden;padding:calc(4.2rem + env(safe-area-inset-top)) 1rem max(1rem,env(safe-area-inset-bottom))}
.lb[open]{display:flex;flex-direction:column;align-items:center;justify-content:center;animation:lb-in .25s ease-out}
.lb::backdrop{background:rgba(4,4,6,.93);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
@keyframes lb-in{from{opacity:0}to{opacity:1}}
.lb-close{position:absolute;top:max(.9rem,env(safe-area-inset-top));right:max(.9rem,env(safe-area-inset-right));width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.65);color:#fff;font-size:1.7rem;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:5;font-family:inherit;transition:background .2s,border-color .2s,transform .2s}
.lb-close:hover{background:var(--ac);border-color:var(--ac);transform:rotate(90deg)}
.lb-fig{margin:0;display:flex;flex-direction:column;align-items:center;gap:.7rem;max-width:min(94vw,900px);min-height:0}
.lb-fig img{display:block;max-width:100%;max-height:calc(100vh - 14rem);max-height:calc(100dvh - 14rem);width:auto;height:auto;object-fit:contain;border-radius:16px;border:2px solid rgba(255,255,255,.9);box-shadow:0 0 0 4px rgba(var(--ac-rgb),.35),0 20px 60px rgba(0,0,0,.7);background:#fff}
.lb-fig img.go-next{animation:lb-next .32s ease}
.lb-fig img.go-prev{animation:lb-prev .32s ease}
@keyframes lb-next{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes lb-prev{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
.lb-fig figcaption{font-size:.85rem;color:#d4d4da;letter-spacing:.03em;text-align:center}
.lb-ctrl{display:flex;align-items:center;gap:1rem;margin-top:1rem}
.lb-nav{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.55);color:#fff;font-size:1.6rem;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;transition:background .2s,border-color .2s}
.lb-nav:hover{background:var(--ac);border-color:var(--ac)}
.lb-dots{display:flex;gap:.5rem;align-items:center}
.lb-dots button{width:9px;height:9px;border-radius:999px;border:none;background:rgba(255,255,255,.35);padding:0;cursor:pointer;transition:width .25s,background .25s}
.lb-dots button.on{width:26px;background:var(--ac)}
.theme-dlg{border:2px solid var(--fr);border-radius:22px;background:linear-gradient(175deg,var(--in1) 0%,var(--in2) 100%);color:#ececf0;padding:0;width:min(350px,92vw);margin:auto;box-shadow:0 0 30px rgba(var(--fr-rgb),.2)}
.theme-dlg::backdrop{background:rgba(5,5,7,.82)}
.theme-dlg[open]{animation:sheet-up .3s ease-out}
.theme-box{padding:1.3rem 1rem 1.4rem;text-align:center}
.theme-title{font-family:'Cormorant Garamond',serif;font-size:1.4rem;font-weight:600;color:#fff;letter-spacing:.04em}
.theme-sub{font-size:.74rem;color:#9a9aa3;margin:.2rem 0 1.1rem}
.theme-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:.9rem .4rem}
.theme-opt{display:flex;flex-direction:column;align-items:center;gap:.4rem;background:none;border:none;color:#d4d4da;font-family:inherit;font-size:.64rem;cursor:pointer}
.theme-opt i{width:44px;height:44px;border-radius:50%;border:2px solid rgba(255,255,255,.4);background:var(--c);transition:transform .2s,box-shadow .2s}
.theme-opt:hover i{transform:scale(1.1)}
.theme-opt.on i{border-color:#fff;box-shadow:0 0 0 3px var(--c),0 0 16px var(--c)}

.thanks{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;max-width:none;max-height:none;margin:0;border:none;background:transparent;overflow:hidden;padding:1rem;cursor:pointer}
.thanks[open]{display:flex;align-items:center;justify-content:center}
.thanks::backdrop{background:rgba(4,4,6,.0);-webkit-backdrop-filter:blur(0px);backdrop-filter:blur(0px);transition:background .6s ease,backdrop-filter .6s ease,-webkit-backdrop-filter .6s ease}
.thanks.show::backdrop{background:rgba(4,4,6,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.thanks img{display:block;width:auto;height:auto;max-width:min(88vw,520px);max-height:calc(100dvh - 3rem);object-fit:contain;border-radius:16px;border:2px solid var(--fr);box-shadow:0 0 0 4px rgba(var(--ac-rgb),.35),0 20px 60px rgba(0,0,0,.7);opacity:0;transform:scale(.12);transition:transform 1.4s cubic-bezier(.2,.9,.25,1.08),opacity .5s ease}
.thanks.show img{opacity:1;transform:scale(1)}
@media (prefers-reduced-motion:reduce){.thanks img{transition:opacity .3s ease;transform:none}}
