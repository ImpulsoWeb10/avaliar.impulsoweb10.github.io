<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<!--
  TEMPLATE MESTRE IMPULSOWEB10
  Todos os campos entre {{CHAVES}} são substituídos pelo sistema gerador.

  TEXTOS SIMPLES
  {{NOME}} {{SLUG}} {{URL_PAGINA}} {{CATEGORIA}} {{CIDADE}} {{UF}} {{TAGLINE}}
  {{DESCRICAO_CURTA}} {{RUA_NUMERO}} {{BAIRRO}} {{CEP}} {{ENDERECO_COMPLETO}}
  {{ENDERECO_URL}} (endereço já codificado para URL)
  {{TELEFONE_E164}} (ex: +5511999999999)  {{TELEFONE_FORMATADO}} (ex: (11) 99999-9999)
  {{WHATSAPP_NUMERO}} (só dígitos com 55)  {{INSTAGRAM_USER}}
  {{LINK_AVALIACAO_GOOGLE}} {{LAT}} {{LNG}} {{TIPO_SCHEMA}} (ex: LocalBusiness, PaintStore, Bakery)
  {{HORA_ABRE}} (número, ex: 8)  {{HORA_FECHA}} (número, ex: 18)
  {{HORA_ABRE_HHMM}} (ex: 08:00)  {{HORA_FECHA_HHMM}} (ex: 18:00)
  {{TEXTO_HORARIO}} (ex: Seg a sáb · 8h às 18h)  {{GA_ID}} (ex: G-XXXXXXXXXX)

  BLOCOS DE HTML
  {{CHIPS_HTML}}     -> <span class="chip">Produto</span> (repetir)
  {{SERVICOS_HTML}}  -> <li>Texto</li> (repetir, 4 itens)
  {{FAQ_HTML}}       -> <details class="faq-item"><summary class="faq-question">P</summary><div class="faq-answer">R</div></details> (repetir)
  {{TICKER_TEXTO}}   -> frase longa que corre no banner

  SEO LATERAL (DESKTOP)
  {{SEO_H1}} {{SEO_H2_TOPO}} {{SEO_TEXTO_TOPO}}
  {{SEO_TITULO_1}} {{SEO_TEXTO_1}}  {{SEO_TITULO_2}} {{SEO_TEXTO_2}}
  {{SEO_TITULO_3}} {{SEO_TEXTO_3}}  {{SEO_TITULO_4}} {{SEO_TEXTO_4}}

  IMAGENS (.webp, 600x600): {{FOTO_1}} a {{FOTO_4}}  e  {{ALT_FOTO_1}} a {{ALT_FOTO_4}}
  Imagens fixas da pasta: logo ({{LOGO}}), fundo.png, mago.png, moldura.png

  CORES: ajustar as variáveis em :root (sempre em pares: HEX e RGB).
-->
<script async src="https://www.googletagmanager.com/gtag/js?id={{GA_ID}}"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','{{GA_ID}}');</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#07101e">
<title>{{NOME}} | {{CATEGORIA}} em {{CIDADE}}</title>
<meta name="description" content="{{DESCRICAO_CURTA}}">
<meta name="author" content="ImpulsoWeb10">
<meta name="robots" content="index, follow, max-image-preview:large">
<link rel="canonical" href="{{URL_PAGINA}}">
<link rel="icon" href="{{LOGO}}">

<meta property="og:type" content="website">
<meta property="og:site_name" content="{{NOME}}">
<meta property="og:url" content="{{URL_PAGINA}}">
<meta property="og:title" content="{{NOME}} | {{CATEGORIA}} em {{CIDADE}}">
<meta property="og:description" content="{{DESCRICAO_CURTA}}">
<meta property="og:image" content="{{URL_PAGINA}}{{LOGO}}">
<meta property="og:locale" content="pt_BR">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{{NOME}} | {{CATEGORIA}} em {{CIDADE}}">
<meta name="twitter:description" content="{{DESCRICAO_CURTA}}">
<meta name="twitter:image" content="{{URL_PAGINA}}{{LOGO}}">

<script type="application/ld+json" id="schema-json">
{
  "@context": "https://schema.org",
  "@type": "{{TIPO_SCHEMA}}",
  "name": "{{NOME}}",
  "description": "{{DESCRICAO_CURTA}}",
  "image": "{{URL_PAGINA}}{{LOGO}}",
  "@id": "{{URL_PAGINA}}#negocio",
  "url": "{{URL_PAGINA}}",
  "telephone": "{{TELEFONE_E164}}",
  "priceRange": "$$",
  "address": {
    "@type": "PostalAddress",
    "streetAddress": "{{RUA_NUMERO}}",
    "addressLocality": "{{CIDADE}}",
    "addressRegion": "{{UF}}",
    "postalCode": "{{CEP}}",
    "addressCountry": "BR"
  },
  "geo": { "@type": "GeoCoordinates", "latitude": {{LAT}}, "longitude": {{LNG}} },
  "openingHoursSpecification": {
    "@type": "OpeningHoursSpecification",
    "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"],
    "opens": "{{HORA_ABRE_HHMM}}",
    "closes": "{{HORA_FECHA_HHMM}}"
  },
  "sameAs": ["https://www.instagram.com/{{INSTAGRAM_USER}}"]
}
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>
/* ===== CORES DO CLIENTE (único lugar para trocar o tema) ===== */
:root{
  --bg:#07101e;            --bg-rgb:7,16,30;
  --card-1:#102040;        --card-2:#0b1a2e;
  --accent:#c9a96e;        --accent-rgb:201,169,110;
  --accent-soft:#ffe082;
  --side-a-rgb:58,92,110;  --side-b-rgb:150,88,62;
  --text:#e8e2d8;          --title:#f0ece5;
  --muted:#9bb5d4;         --body:#c9d6e6;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{width:100%}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;width:100%;display:flex;flex-direction:column;align-items:center;padding:max(.7rem,env(safe-area-inset-top)) .6rem max(.7rem,env(safe-area-inset-bottom));overflow-x:hidden;position:relative;perspective:1200px}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent-soft);outline-offset:3px}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 60% 50% at 50% 20%,rgba(var(--accent-rgb),.08) 0%,transparent 70%),radial-gradient(ellipse 40% 40% at 80% 80%,rgba(var(--side-a-rgb),.35) 0%,transparent 60%);pointer-events:none;z-index:0}

.app-wrapper{display:flex;flex-direction:column;align-items:center;width:100%;max-width:480px;margin:auto 0;position:relative;z-index:1}

/* Moldura neon (cartão 3D) */
.device-frame{position:relative;z-index:1;width:100%;background:linear-gradient(175deg,var(--card-1) 0%,var(--card-2) 100%);border:2px solid #fff;border-radius:24px;box-shadow:0 0 10px #fff,0 0 20px rgba(255,255,255,.8),0 0 30px rgba(255,255,255,.35),0 15px 35px rgba(0,0,0,.6);padding:1.2rem 1.2rem 1rem;display:flex;flex-direction:column;align-items:center;text-align:center;gap:.75rem;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.175,.885,.32,1.275);will-change:transform}

/* Verso do cartão (aparece ao girar) */
.secret-back{position:absolute;inset:0;width:100%;height:100%;background:var(--bg);border-radius:22px;transform:rotateY(180deg);backface-visibility:hidden;z-index:2;transform-style:preserve-3d;overflow:hidden}
.back-layer{position:absolute;width:100%;height:100%;object-fit:cover;top:0;left:0;border-radius:22px}
.back-layer-fundo{transform:translateZ(-20px)}
.back-layer-mago{transform:translateZ(30px)}
.back-layer-moldura{transform:translateZ(80px);pointer-events:none}

/* Frente */
.page{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:.75rem;width:100%;transform-style:preserve-3d;backface-visibility:hidden}
.layer-back{transform:translateZ(15px);transform-style:preserve-3d}
.layer-mid{transform:translateZ(35px);transform-style:preserve-3d}
.layer-front{transform:translateZ(55px);transform-style:preserve-3d;filter:drop-shadow(0 10px 15px rgba(0,0,0,.5))}
.layer-pop{transform:translateZ(75px);transform-style:preserve-3d;filter:drop-shadow(0 12px 20px rgba(0,0,0,.6))}

/* Logo */
.logo-wrap{display:flex;flex-direction:column;align-items:center;gap:.4rem}
.logo-frame{position:relative;border-radius:14px;overflow:hidden;display:inline-block;animation:logo-pulse 2.6s ease-in-out infinite}
.logo-frame::after{content:'';position:absolute;top:0;left:-110%;width:55%;height:100%;background:linear-gradient(105deg,transparent 20%,rgba(255,255,255,.55) 50%,transparent 80%);transform:skewX(-18deg);animation:logo-shimmer 2.6s ease-in-out infinite;pointer-events:none;z-index:2}
@keyframes logo-pulse{0%{box-shadow:0 0 0 0 rgba(var(--accent-rgb),.55),0 6px 20px rgba(var(--accent-rgb),.25)}55%{box-shadow:0 0 0 12px rgba(var(--accent-rgb),0),0 6px 20px rgba(var(--accent-rgb),.1)}100%{box-shadow:0 0 0 0 rgba(var(--accent-rgb),0),0 6px 20px rgba(var(--accent-rgb),.25)}}
@keyframes logo-shimmer{0%{left:-110%}45%,100%{left:160%}}
.logo-img{display:block;width:160px;height:auto;max-height:72px;border-radius:12px;border:2px solid rgba(var(--accent-rgb),.4);object-fit:contain;background:rgba(var(--accent-rgb),.06);position:relative}
</style>

<!-- Script dinâmico para carregar dados locais se o template não tiver sido processado pelo servidor -->
<script>
document.addEventListener("DOMContentLoaded", function() {
    // Verifica se a tag ainda contém as chaves brutas {{...}}
    if (document.title.includes("{{NOME}}")) {
        fetch('dados.json')
            .then(response => response.json())
            .then(data => {
                const base = data.dados_formulario_base;
                const seo = data.conteudo_enriquecido_desktop.seo_tags;
                
                // Aplica os dados básicos do JSON diretamente no HTML estático para testes
                document.title = `${base.nomeEmpresa} | ${base.segmento} em ${base.cidadeEstado}`;
                
                const metaDesc = document.querySelector('meta[name="description"]');
                if (metaDesc) metaDesc.setAttribute("content", seo.meta_description);
                
                // Mapeia o JSON para o objeto estruturado Schema.org do HTML
                const schemaScript = document.getElementById('schema-json');
                if (schemaScript) {
                    const localSchema = {
                        "@context": "https://schema.org",
                        "@type": "LocalBusiness",
                        "name": base.nomeEmpresa,
                        "description": seo.meta_description,
                        "url": seo.canonical,
                        "telephone": base.whatsapp,
                        "address": {
                            "@type": "PostalAddress",
                            "addressLocality": base.cidadeEstado.split(" / ")[0],
                            "addressRegion": base.cidadeEstado.split(" / ")[1],
                            "addressCountry": "BR"
                        }
