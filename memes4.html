<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Efeitos Surpreendentes em HTML</title>
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0; padding: 0;
  }

  body {
    background-color: #030712;
    color: #ffffff;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* Canvas para o rastro de partículas */
  #canvas-trail {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 1;
  }

  .content {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2rem;
    text-align: center;
  }

  h1 {
    font-size: 1.5rem;
    color: #38bdf8;
  }

  /* 1. Mascote com olhos que seguem o cursor */
  .character {
    width: 140px;
    height: 140px;
    background: linear-gradient(135deg, #6366f1, #a855f7);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    box-shadow: 0 10px 30px rgba(168, 85, 247, 0.4);
    position: relative;
  }

  .eye {
    width: 36px;
    height: 36px;
    background: #ffffff;
    border-radius: 50%;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .pupil {
    width: 16px;
    height: 16px;
    background: #0f172a;
    border-radius: 50%;
    position: absolute;
    transition: transform 0.05s ease-out;
  }

  /* 2. Botão com Sintetizador de Áudio */
  .btn-audio {
    background: #10b981;
    color: #000;
    font-weight: bold;
    font-size: 1rem;
    padding: 1rem 2rem;
    border-radius: 50px;
    border: none;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
    transition: transform 0.2s, background-color 0.2s;
  }

  .btn-audio:active {
    transform: scale(0.95);
  }

  .instructions {
    font-size: 0.85rem;
    color: #94a3b8;
  }
</style>
</head>
<body>

  <canvas id="canvas-trail"></canvas>

  <div class="content">
    <h1>Recursos que Raro se Vê num Site</h1>

    <!-- Mascote que te olha -->
    <div class="character" id="mascot">
      <div class="eye"><div class="pupil"></div></div>
      <div class="eye"><div class="pupil"></div></div>
    </div>

    <!-- Botão com som gerado por JS -->
    <button class="btn-audio" onclick="tocarSomSintetizado()">
      🔊 Clique para Ouvir Som Criado por Código
    </button>

    <p class="instructions">Mova o mouse pela tela para ver o rastro e o mascote te seguindo.</p>
  </div>

<script>
  /* ========================================================
     EFEITO 1: Olhos que acompanham o mouse
     ======================================================== */
  const pupils = document.querySelectorAll('.pupil');

  document.addEventListener('mousemove', (e) => {
    pupils.forEach(pupil => {
      const eye = pupil.parentElement;
      const rect = eye.getBoundingClientRect();
      const eyeX = rect.left + rect.width / 2;
      const eyeY = rect.top + rect.height / 2;

      // Ângulo entre o olho e o cursor
      const angle = Math.atan2(e.clientY - eyeY, e.clientX - eyeX);
      const distance = 8; // Distância máxima da pupila dentro do olho

      const x = Math.cos(angle) * distance;
      const y = Math.sin(angle) * distance;

      pupil.style.transform = `translate(${x}px, ${y}px)`;
    });
  });

  /* ========================================================
     EFEITO 2: Áudio gerado por código (Web Audio API)
     ======================================================== */
  function tocarSomSintetizado() {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (!AudioContext) return;

    const ctx = new AudioContext();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.type = 'sine'; // Tipo de onda sonora (senoidal)
    osc.frequency.setValueAtTime(587.33, ctx.currentTime); // Nota D5 (Ré)
    osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.15); // Transição para A5 (Lá)

    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.start();
    osc.stop(ctx.currentTime + 0.3);
  }

  /* ========================================================
     EFEITO 3: Rastro de Partículas Iluminadas
     ======================================================== */
  const canvas = document.getElementById('canvas-trail');
  const ctx = canvas.getContext('2d');
  let particles = [];

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  document.addEventListener('mousemove', (e) => {
    for (let i = 0; i < 3; i++) {
      particles.push({
        x: e.clientX,
        y: e.clientY,
        size: Math.random() * 5 + 2,
        speedX: (Math.random() - 0.5) * 2,
        speedY: (Math.random() - 0.5) * 2,
        color: `hsl(${Math.random() * 60 + 180}, 100%, 70%)`,
        alpha: 1
      });
    }
  });

  function animateParticles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach((p, index) => {
      p.x += p.speedX;
      p.y += p.speedY;
      p.alpha -= 0.02;

      ctx.save();
      ctx.globalAlpha = p.alpha;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      if (p.alpha <= 0) particles.splice(index, 1);
    });
    requestAnimationFrame(animateParticles);
  }
  animateParticles();
</script>

</body>
</html>
