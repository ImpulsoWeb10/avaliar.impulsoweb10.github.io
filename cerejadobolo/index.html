<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cereja do Bolo | Confeitaria Artesanal & Bolos Decorados</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { 
            --cherry: #e91e63; /* Rosa Cereja */
            --cream: #fff5f7;  /* Fundo suave */
        }
        
        body {
            margin: 0; font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(-45deg, #120107, #2c0514, #1a020c, #000000);
            background-size: 400% 400%; animation: grad 12s infinite;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; color: white; text-align: center;
            overscroll-behavior-y: contain; 
        }

        @keyframes grad { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }

        .card {
            background: rgba(20, 5, 10, 0.75); padding: 40px 20px; border-radius: 40px;
            backdrop-filter: blur(20px); max-width: 360px; width: 92%;
            box-shadow: 0 25px 50px rgba(0,0,0,0.9); border: 1px solid rgba(233, 30, 99, 0.2);
            position: relative; z-index: 1; margin: 20px 0;
        }

        /* LOGO AUMENTADA E FORÇADA A FICAR PERFEITAMENTE REDONDA */
        .logo-container {
            position: relative;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 12px;
            overflow: hidden;
            width: 135px;
            height: 135px;
            border-radius: 50% !important;
            background: rgba(255, 255, 255, 0.03); 
            border: 1px solid rgba(233, 30, 99, 0.3);
            animation: pulseLogo 3s infinite ease-in-out;
            box-sizing: border-box;
        }

        @keyframes pulseLogo {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        .logo-container::after {
            content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 110px; height: 110px; background: var(--cherry); filter: blur(40px);
            opacity: 0.35; z-index: -1; animation: glow 3s infinite alternate;
        }
        @keyframes glow { from { opacity: 0.2; scale: 1; } to { opacity: 0.5; scale: 1.2; } }

        /* Brilho passando por dentro do círculo */
        .logo-container::before {
            content: ''; position: absolute; top: 0; left: -150%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            z-index: 3; transform: skewX(-20deg); animation: shimmerLogo 4s infinite ease-in-out;
        }
        @keyframes shimmerLogo {
            0% { left: -150%; }
            30% { left: 150%; }
            100% { left: 150%; }
        }

        /* Garante que a imagem se adapte perfeitamente sem cortes */
        .logo { 
            max-width: 100%; 
            max-height: 100%; 
            object-fit: contain; 
            border-radius: 50%;
            position: relative; 
            z-index: 2; 
            display: block; 
        }

        /* PALCO DO CARROSSEL */
        .dynamic-stage {
            width: 100%;
            height: 200px;
            border-radius: 20px;
            overflow: hidden;
            margin: 20px 0;
            position: relative;
            border: 1px solid rgba(255,255,255,0.1);
            background: #120208;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .dynamic-stage::after {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8); pointer-events: none; z-index: 5;
        }

        /* IMAGEM COMEÇA PEQUENA E CRESCE */
        .stage-item {
            width: 100%; height: 100%; object-fit: cover; position: absolute;
            opacity: 0; transform: scale(0.1); transition: transform 1.8s cubic-bezier(0.1, 0.8, 0.3, 1), opacity 1s ease-in; z-index: 2;
        }

        .stage-item.animate-in { opacity: 1; transform: scale(1); }

        /* BOTÃO DE DESTAQUE */
        .btn-google {
            position: relative; display: block; margin: 15px auto; padding: 18px;
            width: 90%; font-weight: 800; text-decoration: none; border-radius: 50px;
            background: var(--cherry); color: #fff; text-transform: uppercase; font-size: 13px;
            animation: pulse 2.5s infinite; border: none; cursor: pointer; letter-spacing: 0.5px;
        }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(233, 30, 99, 0.6); } 70% { box-shadow: 0 0 0 12px rgba(233, 30, 99, 0); } 100% { box-shadow: 0 0 0 0 rgba(233, 30, 99, 0); } }

        .social-row { display: flex; justify-content: center; gap: 12px; margin: 20px 0; }
        .icon-btn {
            width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            text-decoration: none; color: white; font-size: 20px; background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1); transition: 0.3s;
        }
        .wa{background:#25D366;} .tel{background:#ff4081;} .ig{background:linear-gradient(45deg,#833ab4,#fd1d1d,#fcb045);} .maps{background:#ea4335;}

        /* MODAL */
        #modal-info {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); backdrop-filter: blur(10px);
            z-index: 999; display: flex; justify-content: center; align-items: center;
            opacity: 0; visibility: hidden; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #modal-info.active { opacity: 1; visibility: visible; }
        .modal-content {
            background: #1a050e; width: 80%; max-width: 300px; padding: 35px 25px;
            border-radius: 40px; border: 1px solid var(--cherry);
            text-align: center; transform: scale(0.7); transition: 0.4s; position: relative;
        }
        #modal-info.active .modal-content { transform: scale(1); }
        .modal-icon { font-size: 50px; color: var(--cherry); margin-bottom: 20px; }
        .modal-text { font-size: 18px; font-weight: bold; color: #fff; margin-bottom: 20px; }

        .progress-bar { width: 100%; height: 4px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--cherry); width: 0%; }
        #modal-info.active .progress-fill { animation: fillProgress 4s linear forwards; }
        @keyframes fillProgress { from { width: 0%; } to { width: 100%; } }

        .close-modal { position: absolute; top: 15px; right: 20px; font-size: 28px; color: #777; cursor: pointer; }

        /* RODAPÉ */
        .custom-footer { margin-top: 25px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 20px; }
        .footer-link { color: #fff; text-decoration: none; font-size: 11px; line-height: 1.5; display: block; margin-bottom: 10px; }
        .footer-link b { color: var(--cherry); font-size: 13px; }
        
        .ssl-info { font-size: 10px; opacity: 0.6; color: #fff; letter-spacing: 0.5px; }
        .ssl-info i { color: #2ecc71; margin-right: 4px; }
    </style>
</head>
<body>

<div class="card">
    <div class="logo-container">
        <img src="logo.png" class="logo" alt="Cereja do Bolo Logo">
    </div>
    
    <h1 style="font-size:22px; margin:5px 0 0 0; font-weight: 800; letter-spacing: 1px;">CEREJA DO BOLO</h1>
    <p style="color:var(--cherry); font-size: 11px; margin: 5px 0 15px 0; font-weight: 700; letter-spacing: 2px;">CONFEITARIA ARTESANAL</p>
    
    <div class="dynamic-stage" id="dynamicStage"></div>

    <a href="https://www.google.com/search?client=firefox-b-d&hs=m8Dq&sca_esv=c3faaa4084c3cbf9&sxsrf=APpeQnuGK2tTyKHtM5_T6pvUPDl-K_8T2g:1783610147303&si=APenkKm7iecQ4G6P-TsbSMFKIQtv3EFIqRAFw-i8uEbk55Z-_zeN_YDx3Nzze9ekiBBa3NpVNDfhfE-nfBppRplcXSbu74dn7eYAcJ-46U3jttNz9tB0MnCTUGF6K3f1_P7kJYtOcknERBUJtPMMMvsdg_YJ-YyZxQ%3D%3D&q=Cereja+do+Bolo+Coment%C3%A1rios&sa=X&ved=2ahUKEwiVqv3J8cWVAxWDjpUCHe3oJd8Q0bkNegQINxAH&biw=1525&bih=687&dpr=0.9" 
       class="btn-google" onclick="handleAction(event, 'Abrindo Avaliações Google', 'google')">
        <i class="fab fa-google"></i> Avaliar no Google
    </a>

    <div class="social-row">
        <a href="https://wa.me/5511991142065" class="icon-btn wa" onclick="handleAction(event, 'Abrindo WhatsApp', 'whatsapp')"><i class="fab fa-whatsapp"></i></a>
        <a href="tel:991142065" class="icon-btn tel" onclick="handleAction(event, 'Ligando para Confeitaria', 'phone')"><i class="fas fa-phone"></i></a>
        <a href="https://www.instagram.com/cereja.do.bolo2019/" class="icon-btn ig" onclick="handleAction(event, 'Acessando Instagram', 'instagram')"><i class="fab fa-instagram"></i></a>
        <a href="https://www.google.com/maps?client=firefox-b-d&um=1&ie=UTF-8&fb=1&gl=br&sa=X&geocode=KcE4UwWQe86UMZrDVyKNL7NU&daddr=R.+Varginha,+218+-+Vila+Zeferina,+Itaquaquecetuba+-+SP,+08576-080" class="icon-btn maps" onclick="handleAction(event, 'Traçando Rota para Confeitaria', 'location-dot')"><i class="fas fa-location-dot"></i></a>
    </div>

    <div class="custom-footer">
        <a href="https://wa.me/5511954950044" class="footer-link">
            Quer seu link personalizado igual a esse? <br>
            <b>Saiba mais: (11) 95495-0044</b>
        </a>
        <div class="ssl-info">
            <i class="fas fa-lock"></i> Conexão Segura SSL | @2026 Todos os direitos reservados
        </div>
    </div>
</div>

<div id="modal-info">
    <div class="modal-content">
        <span class="close-modal" onclick="closeModal()">×</span>
        <div class="modal-icon"><i id="m-icon" class="fas fa-circle-notch"></i></div>
        <div class="modal-text" id="m-text">Acessando...</div>
        <div class="progress-bar"><div class="progress-fill"></div></div>
    </div>
</div>

<audio id="click-sound" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3" preload="auto"></audio>

<script>
    // CONFIGURAÇÃO DO CARROSSEL DE EXATAMENTE 3 IMAGENS (BOLO1, BOLO2, BOLO3)
    const stageData = [
        { src: 'bolo1.jpeg', alt: 'Bolo Decorado 1' },
        { src: 'bolo2.jpeg', alt: 'Doces Finos Gourmet' },
        { src: 'bolo3.jpeg', alt: 'Bolo de Festa Cereja' }
    ];

    const stage = document.getElementById('dynamicStage');
    let currentIndex = 0;

    function runStageCycle() {
        stage.innerHTML = '';
        const data = stageData[currentIndex];

        const img = document.createElement('img');
        img.src = data.src;
        img.alt = data.alt;
        img.className = 'stage-item';
        stage.appendChild(img);
        
        // Efeito: Começa pequenininha (scale 0.1) e expande suavemente (scale 1)
        setTimeout(() => img.classList.add('animate-in'), 50);
        setTimeout(nextStep, 4000); 
    }

    function nextStep() {
        currentIndex = (currentIndex + 1) % stageData.length;
        runStageCycle();
    }

    runStageCycle();

    // INTERAÇÕES (MODAL COM CONTADOR DE REDIRECIONAMENTO)
    let redirectTimer;
    const sound = document.getElementById('click-sound');

    function handleAction(event, frase, iconName) {
        event.preventDefault();
        const url = event.currentTarget.href;
        sound.currentTime = 0;
        sound.play();

        document.getElementById('m-text').innerText = frase;
        document.getElementById('m-icon').className = 'fas fa-' + iconName;
        document.getElementById('modal-info').classList.add('active');

        redirectTimer = setTimeout(() => {
            window.location.href = url;
        }, 4000);
    }

    function closeModal() {
        clearTimeout(redirectTimer);
        document.getElementById('modal-info').classList.remove('active');
    }
</script>

</body>
</html>
